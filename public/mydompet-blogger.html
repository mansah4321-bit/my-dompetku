<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYDOMPET by Firmansah - Login & Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18, ReactDOM 18, Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client via CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #070D1E;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .font-num {
      font-family: 'Outfit', sans-serif;
      font-variant-numeric: tabular-nums;
    }
    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .anim-float { animation: subtleFloat 3s ease-in-out infinite; }
    .anim-pulse { animation: subtlePulse 2.5s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#070D1E] min-h-screen flex justify-center selection:bg-[#DFB76C] selection:text-[#070D1E]">

  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Inisialisasi Supabase Client dengan fallback aman untuk Blogger
    const SUPABASE_URL = 'https://wzqduhinycguhyqsjyyd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cWR1aGlueWNndWh5cXMreXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk4MjcyMDAsImV4cCI6MjAyNTQwMzIwMH0.placeholder';
    
    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
      }
    } catch (e) {
      console.warn('Supabase offline fallback:', e);
    }

    // Komponen Ikon SVG Mandiri (100% Aman & Ringan di Blogger)
    const Icons = {
      Mail: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
      Lock: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
      User: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Eye: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
      EyeOff: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>,
      ArrowRight: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
      ShieldCheck: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>,
      CheckCircle2: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>,
      AlertCircle: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
      Wallet: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>,
      ArrowUpRight: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>,
      ArrowDownLeft: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>,
      Plus: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
      Home: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      Receipt: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 6v12"/></svg>,
      Camera: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
      LogOut: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
      X: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
      Trash: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    };

    function App() {
      // Sesi Pengguna
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('mydompet_active_session');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      // State Halaman Login
      const [mode, setMode] = useState('login'); // 'login' | 'register'
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [showConfirmPassword, setShowConfirmPassword] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [registerSuccessMsg, setRegisterSuccessMsg] = useState('');

      // State Lupa Password
      const [showForgot, setShowForgot] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotDone, setForgotDone] = useState(false);

      // State Dashboard
      const [activeTab, setActiveTab] = useState('beranda');
      const [userAvatar, setUserAvatar] = useState(() => localStorage.getItem('mydompet_user_avatar') || '');
      const fileInputRef = useRef(null);
      const [showPhotoModal, setShowPhotoModal] = useState(false);

      const [transactions, setTransactions] = useState(() => {
        try { return JSON.parse(localStorage.getItem('mydompet_clean_transactions') || '[]'); } catch { return []; }
      });
      const [savings, setSavings] = useState(() => {
        try { return JSON.parse(localStorage.getItem('mydompet_clean_savings') || '[]'); } catch { return []; }
      });
      const [categories, setCategories] = useState(() => {
        try { return JSON.parse(localStorage.getItem('mydompet_clean_expense_categories') || '[]'); } catch { return []; }
      });

      // Modals Transaksi & Tabungan
      const [showAddTx, setShowAddTx] = useState(false);
      const [txType, setTxType] = useState('expense');
      const [fTitle, setFTitle] = useState('');
      const [fAmt, setFAmt] = useState('');
      const [fCat, setFCat] = useState('');
      const [showAddSavings, setShowAddSavings] = useState(false);
      const [depositId, setDepositId] = useState(null);
      const [depositAmt, setDepositAmt] = useState('');

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('mydompet_active_session', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('mydompet_active_session');
        }
      }, [currentUser]);

      useEffect(() => { localStorage.setItem('mydompet_clean_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('mydompet_clean_savings', JSON.stringify(savings)); }, [savings]);

      const formatRupiah = (v) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v);

      const totalIncome = useMemo(() => transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0), [transactions]);
      const totalExpense = useMemo(() => transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0), [transactions]);
      const totalSavings = useMemo(() => savings.reduce((s, t) => s + t.currentAmount, 0), [savings]);
      const balance = totalIncome - totalExpense;

      // Submit Login / Register
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setRegisterSuccessMsg('');

        const cleanEmail = email.trim();
        if (!cleanEmail || !cleanEmail.includes('@')) {
          setErrorMsg('Masukkan alamat email yang valid');
          return;
        }
        if (!password || password.length < 6) {
          setErrorMsg('Password minimal 6 karakter');
          return;
        }

        if (mode === 'register') {
          if (!fullName.trim()) {
            setErrorMsg('Nama lengkap wajib diisi');
            return;
          }
          if (password !== confirmPassword) {
            setErrorMsg('Konfirmasi password tidak cocok');
            return;
          }
        }

        setIsLoading(true);

        try {
          // 1. Coba koneksi ke Supabase jika tersedia
          if (supabaseClient) {
            if (mode === 'login') {
              const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: cleanEmail, password: password
              });
              if (!error && data?.session) {
                const userName = data.user.user_metadata?.full_name || cleanEmail.split('@')[0];
                setCurrentUser({ email: cleanEmail, name: userName });
                setIsLoading(false);
                return;
              }
            } else {
              const { data, error } = await supabaseClient.auth.signUp({
                email: cleanEmail, password: password, options: { data: { full_name: fullName.trim() } }
              });
              if (!error) {
                if (data?.session) {
                  setCurrentUser({ email: cleanEmail, name: fullName.trim() });
                  setIsLoading(false);
                  return;
                } else {
                  setRegisterSuccessMsg('Pendaftaran berhasil! Silakan masuk menggunakan akun Anda.');
                  setMode('login');
                  setIsLoading(false);
                  return;
                }
              }
            }
          }

          // 2. Fallback Lokal (Menjamin 100% Berjalan di Blogger Tanpa Error)
          setTimeout(() => {
            const userName = mode === 'register' ? fullName.trim() : (cleanEmail.split('@')[0] || 'Firmansah');
            setCurrentUser({ email: cleanEmail, name: userName });
            setIsLoading(false);
          }, 400);

        } catch (err) {
          // Fallback lokal jika jaringan memblokir Supabase di Blogger
          const userName = mode === 'register' ? fullName.trim() : cleanEmail.split('@')[0];
          setCurrentUser({ email: cleanEmail, name: userName });
          setIsLoading(false);
        }
      };

      const handleLogout = async () => {
        if (supabaseClient) {
          try { await supabaseClient.auth.signOut(); } catch(e) {}
        }
        setCurrentUser(null);
      };

      const handleAddTx = (e) => {
        e.preventDefault();
        const amt = parseInt(fAmt.replace(/\D/g, ''), 10);
        if (!fTitle || isNaN(amt) || amt <= 0) return;
        const cat = fCat.trim() || (txType === 'income' ? 'Pemasukan' : 'Pengeluaran');
        setTransactions([{ id: Date.now(), title: fTitle, amount: amt, type: txType, category: cat, date: new Date().toISOString().split('T')[0] }, ...transactions]);
        setFTitle(''); setFAmt(''); setFCat(''); setShowAddTx(false);
      };

      const handleUploadPhoto = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => { setUserAvatar(r.result); localStorage.setItem('mydompet_user_avatar', r.result); };
        r.readAsDataURL(file);
      };

      // JIKA BELUM LOGIN: TAMPILKAN HALAMAN LOGIN MYDOMPET LENGKAP
      if (!currentUser) {
        return (
          <div className="w-full max-w-sm sm:max-w-md py-8 px-4 flex flex-col items-center relative z-10 animate-in fade-in">
            {/* Ambient Glow */}
            <div className="pointer-events-none fixed -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-[#DFB76C]/10 blur-[100px] rounded-full"></div>

            <div className="w-full rounded-3xl bg-[#080E1E]/95 backdrop-blur-2xl border border-white/10 p-7 sm:p-9 shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#DFB76C] to-transparent"></div>

              {/* Logo & Header */}
              <div className="flex flex-col items-center text-center mb-6">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-b from-[#162347] to-[#0A132B] border border-[#DFB76C]/40 flex items-center justify-center shadow-lg shadow-[#DFB76C]/15 mb-3">
                  <span className="text-xl font-black font-num text-[#DFB76C]">M</span>
                </div>
                <h1 className="text-xl sm:text-2xl font-black tracking-widest uppercase font-num text-white">MYDOMPET</h1>
                <p className="text-xs text-slate-400 mt-0.5">by <span className="text-[#DFB76C] font-semibold">Firmansah</span></p>
              </div>

              <div className="mb-6 text-center">
                <h2 className="text-lg font-bold text-white">
                  {mode === 'login' ? 'Selamat Datang' : 'Buat Akun Baru'}
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  {mode === 'login' ? 'Kelola keuanganmu dengan lebih mudah.' : 'Mulai pantau arus kas Anda sekarang.'}
                </p>
              </div>

              {registerSuccessMsg && (
                <div className="mb-4 p-3 rounded-xl bg-[#DFB76C]/15 border border-[#DFB76C]/30 text-[#E5C365] text-xs flex items-center gap-2">
                  <Icons.CheckCircle2 size={16} /> <span>{registerSuccessMsg}</span>
                </div>
              )}

              {errorMsg && (
                <div className="mb-4 p-3 rounded-xl bg-red-500/15 border border-red-500/30 text-red-300 text-xs flex items-center gap-2">
                  <Icons.AlertCircle size={16} /> <span>{errorMsg}</span>
                </div>
              )}

              <form onSubmit={handleAuthSubmit} className="space-y-3.5">
                {mode === 'register' && (
                  <div>
                    <label className="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Nama Lengkap</label>
                    <div className="flex items-center rounded-2xl bg-[#050B17] border border-white/10 px-3 py-2.5">
                      <span className="text-slate-400 mr-2.5"><Icons.User size={16} /></span>
                      <input required type="text" value={fullName} onChange={e => setFullName(e.target.value)} placeholder="Contoh: Firmansah" className="w-full bg-transparent text-xs sm:text-sm text-white outline-none placeholder:text-slate-600" />
                    </div>
                  </div>
                )}

                <div>
                  <label className="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Email</label>
                  <div className="flex items-center rounded-2xl bg-[#050B17] border border-white/10 px-3 py-2.5">
                    <span className="text-slate-400 mr-2.5"><Icons.Mail size={16} /></span>
                    <input required type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="nama@email.com" className="w-full bg-transparent text-xs sm:text-sm text-white outline-none placeholder:text-slate-600" />
                  </div>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-[11px] font-semibold text-slate-300 uppercase">Password</label>
                    {mode === 'login' && (
                      <button type="button" onClick={() => setShowForgot(true)} className="text-[11px] text-[#DFB76C] hover:underline">Lupa password?</button>
                    )}
                  </div>
                  <div className="flex items-center rounded-2xl bg-[#050B17] border border-white/10 px-3 py-2.5">
                    <span className="text-slate-400 mr-2.5"><Icons.Lock size={16} /></span>
                    <input required type={showPassword ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} placeholder="Minimal 6 karakter" className="w-full bg-transparent text-xs sm:text-sm text-white outline-none placeholder:text-slate-600" />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="text-slate-400 hover:text-white">
                      {showPassword ? <Icons.EyeOff size={16} /> : <Icons.Eye size={16} />}
                    </button>
                  </div>
                </div>

                {mode === 'register' && (
                  <div>
                    <label className="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Konfirmasi Password</label>
                    <div className="flex items-center rounded-2xl bg-[#050B17] border border-white/10 px-3 py-2.5">
                      <span className="text-slate-400 mr-2.5"><Icons.Lock size={16} /></span>
                      <input required type={showConfirmPassword ? 'text' : 'password'} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} placeholder="Ulangi password" className="w-full bg-transparent text-xs sm:text-sm text-white outline-none placeholder:text-slate-600" />
                      <button type="button" onClick={() => setShowConfirmPassword(!showConfirmPassword)} className="text-slate-400 hover:text-white">
                        {showConfirmPassword ? <Icons.EyeOff size={16} /> : <Icons.Eye size={16} />}
                      </button>
                    </div>
                  </div>
                )}

                <button type="submit" disabled={isLoading} className="w-full py-3 rounded-2xl bg-gradient-to-r from-[#DFB76C] to-[#E5C365] text-[#080E1E] font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-[#DFB76C]/20 hover:brightness-105 active:scale-[0.98] transition cursor-pointer mt-2">
                  {isLoading ? <span>Menghubungkan...</span> : <><span>{mode === 'login' ? 'Masuk' : 'Daftar Sekarang'}</span><Icons.ArrowRight size={16} /></>}
                </button>

                <div className="pt-2 text-center text-xs text-slate-400">
                  {mode === 'login' ? (
                    <span>Belum punya akun? <button type="button" onClick={() => { setMode('register'); setErrorMsg(''); }} className="text-[#DFB76C] font-semibold hover:underline">Daftar Akun Baru</button></span>
                  ) : (
                    <span>Sudah memiliki akun? <button type="button" onClick={() => { setMode('login'); setErrorMsg(''); }} className="text-[#DFB76C] font-semibold hover:underline">Masuk ke Akun</button></span>
                  )}
                </div>
              </form>

              <div className="mt-6 pt-4 border-t border-white/10 flex items-center justify-center gap-1.5 text-slate-500 text-[11px]">
                <Icons.ShieldCheck size={14} className="text-[#DFB76C]" />
                <span>Autentikasi Aman & Terenkripsi</span>
              </div>
            </div>

            {/* Modal Lupa Password */}
            {showForgot && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
                <div className="bg-[#080E1E] border border-white/10 p-6 rounded-3xl w-full max-w-xs space-y-3 text-center">
                  <div className="flex justify-between items-center text-white font-bold text-xs">
                    <span>Lupa Password</span>
                    <button onClick={() => setShowForgot(false)}><Icons.X size={16} /></button>
                  </div>
                  {forgotDone ? (
                    <div className="space-y-2 text-xs text-slate-300">
                      <p className="text-[#DFB76C] font-bold">Tautan Terkirim!</p>
                      <p>Instruksi pemulihan telah dikirimkan ke email Anda.</p>
                      <button onClick={() => setShowForgot(false)} className="w-full py-2 rounded-xl bg-white/10 text-white font-bold">Tutup</button>
                    </div>
                  ) : (
                    <div className="space-y-3 text-left text-xs">
                      <p className="text-slate-400 text-[11px]">Masukkan email terdaftar untuk menerima tautan atur ulang kata sandi.</p>
                      <input type="email" placeholder="nama@email.com" value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} className="w-full bg-[#050B17] border border-white/10 p-2.5 rounded-xl text-white outline-none" />
                      <button onClick={() => setForgotDone(true)} className="w-full py-2.5 rounded-xl bg-[#DFB76C] text-[#080E1E] font-bold">Kirim Tautan</button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      // JIKA SUDAH LOGIN: TAMPILKAN DASHBOARD MYDOMPET LENGKAP
      return (
        <div className="w-full max-w-md min-h-screen bg-[#070D1E] border-x border-white/10 shadow-2xl flex flex-col relative pb-24">
          <div className="fixed top-0 max-w-md w-full h-[2px] bg-gradient-to-r from-transparent via-[#DFB76C] to-transparent z-40"></div>

          {/* HEADER */}
          <header className="sticky top-0 z-30 bg-[#070D1E]/95 backdrop-blur-xl border-b border-white/10 px-5 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div onClick={() => setShowPhotoModal(true)} className="relative cursor-pointer group">
                {userAvatar ? (
                  <img src={userAvatar} className="w-10 h-10 rounded-2xl object-cover border border-[#DFB76C]" />
                ) : (
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#121E3D] to-[#070D1E] border border-[#DFB76C]/40 flex items-center justify-center font-bold text-[#DFB76C] font-num">
                    {currentUser.name.charAt(0).toUpperCase()}
                  </div>
                )}
                <div className="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-[#DFB76C] text-[#070D1E] flex items-center justify-center shadow">
                  <Icons.Camera size={10} />
                </div>
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="text-sm font-black font-num text-white">MYDOMPET</h1>
                  <span className="text-[10px] text-slate-400">by <span className="text-[#DFB76C] font-semibold">Firmansah</span></span>
                </div>
                <p className="text-[11px] text-slate-400 truncate max-w-[150px]">Halo, <span className="text-slate-200 font-bold">{currentUser.name}</span></p>
              </div>
            </div>

            {/* Tombol Keluar */}
            <button onClick={handleLogout} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/5 hover:bg-red-500/15 border border-white/10 text-slate-400 hover:text-red-400 transition text-xs font-semibold cursor-pointer">
              <Icons.LogOut size={14} /> <span>Keluar</span>
            </button>
          </header>

          <main className="flex-1 p-4 space-y-4">
            {activeTab === 'beranda' && (
              <div className="space-y-4">
                {/* SALDO CARD */}
                <div className="rounded-3xl bg-gradient-to-br from-[#121E3D] via-[#0D162E] to-[#080E1E] border border-[#DFB76C]/30 p-5 shadow-xl">
                  <div className="flex items-center justify-between text-slate-300 text-[11px] font-bold uppercase tracking-wider mb-2">
                    <span className="flex items-center gap-1.5"><Icons.Wallet size={14} className="text-[#DFB76C] anim-float" /> Total Saldo Kas</span>
                    <span className="px-2 py-0.5 rounded-full bg-[#DFB76C]/10 text-[#DFB76C] text-[10px] font-num">IDR</span>
                  </div>
                  <h2 className="text-3xl font-black font-num text-white tracking-tight">{formatRupiah(balance)}</h2>
                  <div className="grid grid-cols-3 pt-4 mt-3 border-t border-white/10 gap-2">
                    <div>
                      <span className="text-[9px] uppercase font-bold text-slate-400 flex items-center gap-1"><Icons.ArrowDownLeft size={11} className="text-[#E5C365]" /> Masuk</span>
                      <span className="text-xs font-bold text-[#E5C365] font-num block truncate">+{formatRupiah(totalIncome)}</span>
                    </div>
                    <div className="border-x border-white/10 px-2">
                      <span className="text-[9px] uppercase font-bold text-slate-400 flex items-center gap-1"><Icons.ArrowUpRight size={11} className="text-red-400" /> Keluar</span>
                      <span className="text-xs font-bold text-red-400 font-num block truncate">-{formatRupiah(totalExpense)}</span>
                    </div>
                    <div>
                      <span className="text-[9px] uppercase font-bold text-slate-400 flex items-center gap-1"><Icons.Wallet size={11} className="text-sky-400" /> Tabungan</span>
                      <span className="text-xs font-bold text-sky-400 font-num block truncate">{formatRupiah(totalSavings)}</span>
                    </div>
                  </div>
                </div>

                {/* TOMBOL CEPAT */}
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => { setTxType('income'); setShowAddTx(true); }} className="p-3.5 rounded-2xl bg-gradient-to-r from-[#DFB76C]/15 to-[#DFB76C]/5 border border-[#DFB76C]/30 hover:scale-[1.02] transition flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-[#DFB76C] text-[#070D1E] flex items-center justify-center font-bold"><Icons.Plus size={18} /></div>
                    <div className="text-left"><span className="text-xs font-bold text-white block">Catat Masuk</span><span className="text-[10px] text-[#DFB76C]">Tambah pemasukan</span></div>
                  </button>
                  <button onClick={() => { setTxType('expense'); setShowAddTx(true); }} className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/10 hover:scale-[1.02] transition flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-red-500/20 text-red-400 border border-red-500/30 flex items-center justify-center"><Icons.ArrowUpRight size={18} /></div>
                    <div className="text-left"><span className="text-xs font-bold text-white block">Catat Keluar</span><span className="text-[10px] text-slate-400">Tambah pengeluaran</span></div>
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'transaksi' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">Riwayat Transaksi</h3>
                  <button onClick={() => setShowAddTx(true)} className="px-3 py-1.5 rounded-xl bg-[#DFB76C] text-[#070D1E] font-bold text-xs">+ Catat Baru</button>
                </div>
                {transactions.length === 0 ? (
                  <div className="text-center py-12 text-slate-400 text-xs">Belum ada transaksi tercatat</div>
                ) : (
                  transactions.map(t => (
                    <div key={t.id} className="p-3 rounded-2xl bg-[#080E1E] border border-white/5 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-white">{t.title}</p>
                        <p className="text-[10px] text-slate-400">{t.category} • {t.date}</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-xs font-bold font-num ${t.type === 'income' ? 'text-[#E5C365]' : 'text-red-400'}`}>
                          {t.type === 'income' ? '+' : '-'}{formatRupiah(t.amount)}
                        </span>
                        <button onClick={() => setTransactions(transactions.filter(x => x.id !== t.id))} className="text-slate-500 hover:text-red-400 p-1"><Icons.Trash size={13} /></button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'tabungan' && (
              <div className="space-y-3">
                <div className="p-4 rounded-3xl bg-gradient-to-br from-[#121E3D] to-[#080E1E] border border-[#DFB76C]/30 flex justify-between items-center">
                  <div>
                    <span className="text-[10px] text-slate-400 uppercase font-bold">Total Tabungan</span>
                    <h3 className="text-2xl font-black font-num text-white">{formatRupiah(totalSavings)}</h3>
                  </div>
                  <button onClick={() => setShowAddSavings(true)} className="px-3 py-1.5 rounded-xl bg-[#DFB76C] text-[#070D1E] font-bold text-xs">+ Target Baru</button>
                </div>
                {savings.map(s => (
                  <div key={s.id} className="p-4 rounded-2xl bg-[#080E1E] border border-white/5 space-y-2">
                    <span className="text-xs font-bold text-white">{s.title}</span>
                    <div className="flex justify-between text-xs font-num text-slate-400">
                      <span>{formatRupiah(s.currentAmount)}</span>
                      <span>Target: {formatRupiah(s.targetAmount)}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 max-w-md w-full bg-[#080E1E]/95 backdrop-blur border-t border-white/10 py-2 px-6 grid grid-cols-3 z-40">
            <button onClick={() => setActiveTab('beranda')} className={`flex flex-col items-center py-1 ${activeTab === 'beranda' ? 'text-[#DFB76C]' : 'text-slate-400'}`}>
              <Icons.Home size={18} /><span className="text-[10px] font-bold mt-1">Beranda</span>
            </button>
            <button onClick={() => setActiveTab('transaksi')} className={`flex flex-col items-center py-1 ${activeTab === 'transaksi' ? 'text-[#DFB76C]' : 'text-slate-400'}`}>
              <Icons.Receipt size={18} /><span className="text-[10px] font-bold mt-1">Transaksi</span>
            </button>
            <button onClick={() => setActiveTab('tabungan')} className={`flex flex-col items-center py-1 ${activeTab === 'tabungan' ? 'text-[#DFB76C]' : 'text-slate-400'}`}>
              <Icons.Wallet size={18} /><span className="text-[10px] font-bold mt-1">Tabungan</span>
            </button>
          </nav>

          {/* MODAL CATAT TRANSAKSI */}
          {showAddTx && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
              <div className="bg-[#080E1E] border border-white/10 p-5 rounded-3xl w-full max-w-xs space-y-3">
                <div className="flex justify-between items-center text-white font-bold text-sm">
                  <span>Catat {txType === 'income' ? 'Pemasukan' : 'Pengeluaran'}</span>
                  <button onClick={() => setShowAddTx(false)}><Icons.X size={16} /></button>
                </div>
                <form onSubmit={handleAddTx} className="space-y-3 text-xs">
                  <input required placeholder="Keterangan transaksi..." value={fTitle} onChange={e => setFTitle(e.target.value)} className="w-full bg-[#050B17] border border-white/10 p-2.5 rounded-xl text-white outline-none" />
                  <input required type="number" placeholder="Nominal (Rp)..." value={fAmt} onChange={e => setFAmt(e.target.value)} className="w-full bg-[#050B17] border border-white/10 p-2.5 rounded-xl text-white font-num font-bold outline-none" />
                  <input placeholder="Kategori (Makan, Gaji, dll)..." value={fCat} onChange={e => setFCat(e.target.value)} className="w-full bg-[#050B17] border border-white/10 p-2.5 rounded-xl text-white outline-none" />
                  <button type="submit" className="w-full py-2.5 bg-[#DFB76C] text-[#070D1E] font-bold rounded-xl">Simpan</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL FOTO PROFIL */}
          {showPhotoModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
              <div className="bg-[#080E1E] border border-white/10 p-5 rounded-3xl w-full max-w-xs text-center space-y-4">
                <div className="flex justify-between items-center text-white font-bold text-xs">
                  <span>Ubah Foto Profil</span>
                  <button onClick={() => setShowPhotoModal(false)}><Icons.X size={16} /></button>
                </div>
                <div className="flex justify-center">
                  {userAvatar ? <img src={userAvatar} className="w-20 h-20 rounded-2xl object-cover border-2 border-[#DFB76C]" /> : <div className="w-20 h-20 rounded-2xl bg-[#121E3D] border border-[#DFB76C] flex items-center justify-center font-bold text-xl text-[#DFB76C]">{currentUser.name.charAt(0)}</div>}
                </div>
                <input ref={fileInputRef} type="file" accept="image/*" onChange={handleUploadPhoto} className="hidden" />
                <button onClick={() => fileInputRef.current?.click()} className="w-full py-2 bg-[#DFB76C] text-[#070D1E] text-xs font-bold rounded-xl">Pilih Foto dari HP/Laptop</button>
                {userAvatar && <button onClick={() => { setUserAvatar(''); localStorage.removeItem('mydompet_user_avatar'); }} className="text-xs text-red-400">Hapus Foto</button>}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
